<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE SONG</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f8f4ea;color:#33445c}button,input{font:inherit}.wrap{max-width:560px;margin:auto;padding:28px 18px}.card{background:#fffdf8;border:1px solid #dbe8f4;border-radius:24px;padding:24px;box-shadow:0 8px 25px #9bb9d022}.logo{text-align:center;font-size:30px;font-weight:800;letter-spacing:3px;color:#6e9fc9;margin:20px 0 8px}.sub{text-align:center;color:#7b8796;margin-bottom:28px}.btn{width:100%;padding:14px;border:0;border-radius:15px;background:#cbe7f6;color:#31516d;font-weight:700;cursor:pointer;margin-top:10px}.btn.secondary{background:#edf5fb}.back{background:none;border:0;color:#6e9fc9;cursor:pointer;padding:0;margin-bottom:16px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d7e2ed;border-radius:13px;background:white;outline:none}.field input:focus{border-color:#8bb8dd}.code{font-size:30px;font-weight:800;letter-spacing:5px;text-align:center;color:#638fb8;background:#eef6fc;padding:16px;border-radius:16px;margin:15px 0}.roomhead{text-align:center;margin-bottom:22px}.roomname{font-size:24px;font-weight:800}.hint{font-size:13px;color:#8290a0}.song{border:1px solid #dbe8f4;border-radius:18px;padding:17px;margin:12px 0;background:#fff}.song .name{font-weight:800;font-size:17px}.song .note{margin-top:7px;color:#718096;font-size:14px;line-height:1.5}.status{padding:12px;border-radius:13px;background:#eef6fc;font-size:14px;margin:14px 0}.hidden{display:none}.small{font-size:12px;color:#8b96a4;margin-top:12px;text-align:center}.history-title{font-weight:800;margin:24px 0 10px}.day{font-size:13px;color:#7890a8;margin-bottom:5px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0;font-size:18px}.calendar-head button{border:0;background:#eef7fb;border-radius:10px;width:36px;height:32px;font-size:22px;cursor:pointer}.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekdays span{text-align:center;font-size:12px;color:#7b8b94;padding:4px 0}.day{min-height:48px;border:1px solid #e7eef1;background:#fff;border-radius:10px;padding:6px;text-align:left;cursor:pointer;position:relative}.day.empty{border:0;background:transparent;cursor:default}.day.has-song{background:#f0f8fc;border-color:#cce6f2}.day .date{font-size:12px}.day .dot{position:absolute;right:7px;bottom:5px;font-size:16px}.day-detail{margin-top:14px;background:#f7fbfd;border-radius:12px;padding:12px}.history-song{padding:8px 0;border-bottom:1px solid #e3edf1}.history-song:last-child{border-bottom:0}.memo{font-size:12px;color:#71818a;margin-top:4px}.muted{color:#8a979d;font-size:13px}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://rgpezwvpzxdtqjhqdoai.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_dEChYoS6Tno45x9iTFJrsw_dumRzRHw';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const KEY='one_song_online_v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{screen:'home',room:null,currentUserId:null,calendarYear:null,calendarMonth:null};
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function home(){state.screen='home';save()}function create(){state.screen='create';save()}function join(){state.screen='join';save()}
function makeCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];return code}
function localUserId(){let id=localStorage.getItem('one_song_browser_id');if(!id){id=crypto.randomUUID();localStorage.setItem('one_song_browser_id',id)}return id}
async function createRoom(){
 const roomName=document.getElementById('roomName').value.trim(),name=document.getElementById('myName').value.trim();
 if(!roomName||!name){alert('방 이름과 내 이름을 모두 입력해주세요!');return}
 const code=makeCode();
 const {data:room,error:rerr}=await db.from('rooms').insert({code,room_name:roomName}).select().single();
 if(rerr){alert('방을 만들지 못했어요.\nSupabase 설정을 확인해주세요.\n\n'+rerr.message);return}
 const {data:user,error:uerr}=await db.from('users').insert({room_id:room.id,name}).select().single();
 if(uerr){await db.from('rooms').delete().eq('id',room.id);alert('사용자 정보를 저장하지 못했어요.\n\n'+uerr.message);return}
 state.room={id:room.id,code:room.code,roomName:room.room_name};state.currentUserId=user.id;state.screen='room';save();await loadRoom();
}
async function joinRoom(){
 const code=document.getElementById('joinCode').value.trim().toUpperCase(),name=document.getElementById('friendName').value.trim();
 if(!code||!name){alert('방 코드와 내 이름을 모두 입력해주세요!');return}
 const {data:room,error:rerr}=await db.from('rooms').select('*').eq('code',code).maybeSingle();
 if(rerr||!room){alert('방 코드를 찾을 수 없어요. 코드를 다시 확인해주세요!');return}
 const {data:users,error:uerr}=await db.from('users').select('*').eq('room_id',room.id).order('created_at',{ascending:true});
 if(uerr){alert('방 정보를 불러오지 못했어요.\n\n'+uerr.message);return}
 if(users.length>=2){alert('이 방은 이미 2명이 사용하고 있어요.');return}
 const {data:user,error:err}=await db.from('users').insert({room_id:room.id,name}).select().single();
 if(err){alert('입장하지 못했어요.\n\n'+err.message);return}
 state.room={id:room.id,code:room.code,roomName:room.room_name};state.currentUserId=user.id;state.screen='room';save();await loadRoom();
}
async function loadRoom(){
 if(!state.room?.id||!state.currentUserId)return;
 const {data:users,error:uerr}=await db.from('users').select('*').eq('room_id',state.room.id).order('created_at',{ascending:true});
 const {data:songs,error:serr}=await db.from('songs').select('*').eq('room_id',state.room.id).order('song_date',{ascending:false}).order('created_at',{ascending:true});
 if(uerr||serr){alert('방의 노래 정보를 불러오지 못했어요.\n\n'+(uerr||serr).message);return}
 state.room.users=users||[];state.room.songs=songs||[];state.room.history=buildHistory(state.room.users,state.room.songs);localStorage.setItem(KEY,JSON.stringify(state));render();
}
function buildHistory(users,songs){
 const map={};for(const song of songs){if(!map[song.song_date])map[song.song_date]=[];const idx=users.findIndex(u=>u.id===song.user_id);map[song.song_date][idx>=0?idx:map[song.song_date].length]={...song}}
 return Object.entries(map).map(([key,songs])=>({key,date:key,songs})).sort((a,b)=>b.key.localeCompare(a.key));
}
function openHistory(){const now=new Date();state.calendarYear=state.calendarYear??now.getFullYear();state.calendarMonth=state.calendarMonth??now.getMonth();state.screen='history';save()}
function backToRoom(){state.screen='room';save();loadRoom()}
function renderHistoryScreen(){
 const now=new Date(),year=state.calendarYear??now.getFullYear(),month=state.calendarMonth??now.getMonth();
 const first=new Date(year,month,1),last=new Date(year,month+1,0),startDay=first.getDay(),days=last.getDate(),history=state.room.history||[];let cells='';
 for(let i=0;i<startDay;i++)cells+='<div class="day empty"></div>';
 for(let d=1;d<=days;d++){const key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,item=history.find(h=>h.key===key);cells+=`<button class="day ${item?'has-song':''}" onclick="showDay('${key}')"><span class="date">${d}</span>${item?'<span class="dot">♪</span>':''}</button>`}
 return `<button class="back" onclick="backToRoom()">← ${esc(state.room.roomName)}으로 돌아가기</button><div class="card"><div class="history-screen-title">📅 지난 기록</div><div class="hint">날짜를 누르면 그날의 추천곡을 볼 수 있어요.</div><div class="calendar-head"><button onclick="changeMonth(-1)">‹</button><strong>${year}년 ${month+1}월</strong><button onclick="changeMonth(1)">›</button></div><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="calendar-grid">${cells}</div><div id="day-detail" class="day-detail"><div class="muted">기록이 있는 날짜에는 ♪가 표시돼요.</div></div></div>`;
}
function changeMonth(delta){let y=state.calendarYear??new Date().getFullYear(),m=state.calendarMonth??new Date().getMonth();m+=delta;if(m<0){y--;m=11}if(m>11){y++;m=0}state.calendarYear=y;state.calendarMonth=m;save()}
function showDay(key){const item=(state.room.history||[]).find(h=>h.key===key),detail=document.getElementById('day-detail');if(!detail)return;if(!item){detail.innerHTML=`<div class="muted">${key}에는 등록된 노래가 없어요.</div>`;return}detail.innerHTML=`<div><b>${esc(item.date)}</b></div>`+(item.songs||[]).map((song,i)=>song?`<div class="history-song"><div><b>${esc(state.room.users[i]?.name||'사용자')}</b></div><div><b>${esc(song.artist)}</b> — ${esc(song.title)}</div>${song.note?`<div class="memo">💬 ${esc(song.note)}</div>`:''}</div>`:'').join('')}
async function submitSong(){
 const artist=document.getElementById('artist').value.trim(),title=document.getElementById('title').value.trim(),note=document.getElementById('note').value.trim();if(!artist||!title){alert('가수와 곡 제목을 입력해주세요!');return}
 const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});
 const {error}=await db.from('songs').upsert({room_id:state.room.id,user_id:state.currentUserId,artist,title,note:sanitizeNote(note),song_date:today},{onConflict:'room_id,user_id,song_date'});
 if(error){alert('오늘의 노래를 저장하지 못했어요.\n\n'+error.message);return}await loadRoom();
}
function sanitizeNote(s){return s.slice(0,100)}
function leave(){state={screen:'home',room:null,currentUserId:null,calendarYear:null,calendarMonth:null};save()}
function roomUsers(){return state.room?.users||[]}
function myUser(){return roomUsers().find(u=>u.id===state.currentUserId)}
function otherUser(){return roomUsers().find(u=>u.id!==state.currentUserId)}
function songForUser(uid){const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});return (state.room.songs||[]).find(s=>s.user_id===uid&&s.song_date===today)||null}
async function refreshRoom(){await loadRoom()}
function render(){
 const a=document.getElementById('app');
 if(state.screen==='home'){a.innerHTML=`<div class="logo">ONE SONG</div><div class="sub">오늘의 한 곡을 서로에게 🎧</div><div class="card"><button class="btn" onclick="create()">방 만들기</button><button class="btn secondary" onclick="join()">친구의 방에 들어가기</button></div>`;return}
 if(state.screen==='create'){a.innerHTML=`<button class="back" onclick="home()">← 처음으로</button><div class="card"><h2>방 만들기</h2><div class="field"><label>방 이름</label><input id="roomName" placeholder="예: 서빈이랑 친구의 노래방"></div><div class="field"><label>내 이름</label><input id="myName" placeholder="이름 또는 닉네임"></div><button class="btn" onclick="createRoom()">방 만들기</button></div>`;return}
 if(state.screen==='join'){a.innerHTML=`<button class="back" onclick="home()">← 처음으로</button><div class="card"><h2>친구의 방에 들어가기</h2><div class="field"><label>방 코드</label><input id="joinCode" placeholder="예: A7K2P3" maxlength="6"></div><div class="field"><label>내 이름</label><input id="friendName" placeholder="이름 또는 닉네임"></div><button class="btn" onclick="joinRoom()">들어가기</button></div>`;return}
 if(state.screen==='history'){a.innerHTML=renderHistoryScreen();return}
 if(state.screen==='room'){
   const users=roomUsers(),me=myUser(),other=otherUser(),mySong=me?songForUser(me.id):null,otherSong=other?songForUser(other.id):null,both=!!mySong&&!!otherSong;
   let reveal='';
   if(both){reveal=`<div class="song"><div class="day">오늘</div><div class="name">${esc(me.name)} · ${esc(mySong.artist)} — ${esc(mySong.title)}</div>${mySong.note?`<div class="note">💬 ${esc(mySong.note)}</div>`:''}</div><div class="song"><div class="name">${esc(other.name)} · ${esc(otherSong.artist)} — ${esc(otherSong.title)}</div>${otherSong.note?`<div class="note">💬 ${esc(otherSong.note)}</div>`:''}</div>`}
   else{reveal=`<div class="status">${mySong?'내 노래는 제출 완료! 🎵':'오늘의 노래를 골라주세요 🎧'}<br>${otherSong?`${esc(other?.name||'친구')}도 제출했어요! 둘 다 제출하면 공개돼요.`:'친구가 아직 고르는 중이에요. 둘 다 제출하면 공개돼요.'}</div>`}
   const form=mySong?`<div class="status">오늘의 노래 제출 완료 ✓</div>`:`<div class="field"><label>🎤 가수</label><input id="artist" placeholder="예: D.O."></div><div class="field"><label>🎵 곡 제목</label><input id="title" placeholder="예: 괜찮아도 괜찮아"></div><div class="field"><label>💬 작은 메모 <span style="font-weight:400">(선택)</span></label><input id="note" maxlength="100" placeholder="이 노래를 추천하는 이유는?"></div><button class="btn" onclick="submitSong()">오늘의 노래 제출하기</button>`;
   const count=(state.room.history||[]).length;
   a.innerHTML=`<div class="roomhead"><div class="roomname">${esc(state.room.roomName)}</div><div class="hint">방 코드 · ${esc(state.room.code)}</div></div><div class="card"><div class="hint">${esc(me?.name||'사용자')}님</div>${form}${reveal}<button class="btn secondary history-button" onclick="openHistory()">📅 지난 기록${count?` · ${count}일`:''}</button><button class="btn secondary" onclick="refreshRoom()">↻ 새로고침</button></div><button class="btn secondary" onclick="leave()">나가기</button>`;
 }
}
render();
</script></body></html>
