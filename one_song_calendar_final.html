<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE SONG</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f8f4ea;color:#33445c}button,input{font:inherit} .wrap{max-width:560px;margin:auto;padding:28px 18px}.card{background:#fffdf8;border:1px solid #dbe8f4;border-radius:24px;padding:24px;box-shadow:0 8px 25px #9bb9d022}.logo{text-align:center;font-size:30px;font-weight:800;letter-spacing:3px;color:#6e9fc9;margin:20px 0 8px}.sub{text-align:center;color:#7b8796;margin-bottom:28px}.btn{width:100%;padding:14px;border:0;border-radius:15px;background:#bfe0f4;color:#31516d;font-weight:700;cursor:pointer;margin-top:10px}.btn.secondary{background:#edf5fb}.back{background:none;border:0;color:#6e9fc9;cursor:pointer;padding:0;margin-bottom:16px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d7e2ed;border-radius:13px;background:white;outline:none}.field input:focus{border-color:#8bb8dd}.code{font-size:30px;font-weight:800;letter-spacing:5px;text-align:center;color:#638fb8;background:#eef6fc;padding:16px;border-radius:16px;margin:15px 0}.roomhead{text-align:center;margin-bottom:22px}.roomname{font-size:24px;font-weight:800}.hint{font-size:13px;color:#8290a0}.song{border:1px solid #dbe8f4;border-radius:18px;padding:17px;margin:12px 0;background:#fff}.song .name{font-weight:800;font-size:17px}.song .note{margin-top:7px;color:#718096;font-size:14px;line-height:1.5}.status{padding:12px;border-radius:13px;background:#eef6fc;font-size:14px;margin:14px 0}.hidden{display:none}.small{font-size:12px;color:#8b96a4;margin-top:12px;text-align:center}.history-title{font-weight:800;margin:24px 0 10px}.day{font-size:13px;color:#7890a8;margin-bottom:5px}

.calendar-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0;font-size:18px}
.calendar-head button{border:0;background:#eef7fb;border-radius:10px;width:36px;height:32px;font-size:22px;cursor:pointer}
.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekdays span{text-align:center;font-size:12px;color:#7b8b94;padding:4px 0}
.day{min-height:48px;border:1px solid #e7eef1;background:#fff;border-radius:10px;padding:6px;text-align:left;cursor:pointer;position:relative}
.day.empty{border:0;background:transparent;cursor:default}
.day.has-song{background:#f0f8fc;border-color:#cce6f2}
.day .date{font-size:12px}
.day .dot{position:absolute;right:7px;bottom:5px;font-size:16px}
.day-detail{margin-top:14px;background:#f7fbfd;border-radius:12px;padding:12px}
.history-song{padding:8px 0;border-bottom:1px solid #e3edf1}
.history-song:last-child{border-bottom:0}
.memo{font-size:12px;color:#71818a;margin-top:4px}
.muted{color:#8a979d;font-size:13px}

</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
const KEY='one_song_v2';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{screen:'home',room:null,currentUserIndex:null};
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function home(){state.screen='home';save()}
function create(){state.screen='create';save()}
function join(){state.screen='join';save()}
function createRoom(){
 const roomName=document.getElementById('roomName').value.trim();
 const name=document.getElementById('myName').value.trim();
  if(!roomName||!name){alert('방 이름과 내 이름을 모두 입력해주세요!');return}
 const code=Math.random().toString(36).slice(2,7).toUpperCase();
 state.room={code,roomName,users:[{name,song:null},{name:'친구',song:null}],history:[]};state.currentUserIndex=0;state.screen='room';save();
}
function joinRoom(){
 const code=document.getElementById('joinCode').value.trim().toUpperCase();
 if(!state.room||state.room.code!==code){alert('이 미리보기에서는 내가 만든 방만 같은 기기에서 다시 들어올 수 있어요.\n실제 온라인 공유 버전에서는 친구가 코드를 입력하면 연결되도록 만들 수 있어요!');return}
 state.room.users[1].name=document.getElementById('friendName').value.trim()||'친구';state.currentUserIndex=1;state.screen='room';save();
}

function openHistory(){
 state.calendarYear=new Date().getFullYear();
 state.calendarMonth=new Date().getMonth();
 state.screen='history';
 save();
}
function backToRoom(){state.screen='room';save()}
function renderHistoryScreen(){
 const now=new Date();
 const year=state.calendarYear ?? now.getFullYear();
 const month=state.calendarMonth ?? now.getMonth();
 const first=new Date(year,month,1), last=new Date(year,month+1,0);
 const startDay=first.getDay(), days=last.getDate();
 const history=state.room.history||[];
 let cells='';
 for(let i=0;i<startDay;i++) cells+='<div class="day empty"></div>';
 for(let d=1;d<=days;d++){
   const key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
   const item=history.find(h=>h.key===key);
   cells+=`<button class="day ${item?'has-song':''}" onclick="showDay('${key}')"><span class="date">${d}</span>${item?'<span class="dot">♪</span>':''}</button>`;
 }
 return `<button class="back" onclick="backToRoom()">← ${esc(state.room.roomName)}으로 돌아가기</button>
 <div class="card"><div class="history-screen-title">📅 지난 기록</div>
 <div class="hint">날짜를 누르면 그날의 추천곡을 볼 수 있어요.</div>
 <div class="calendar-head"><button onclick="changeMonth(-1)">‹</button><strong>${year}년 ${month+1}월</strong><button onclick="changeMonth(1)">›</button></div>
 <div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
 <div class="calendar-grid">${cells}</div>
 <div id="day-detail" class="day-detail"><div class="muted">기록이 있는 날짜에는 ♪가 표시돼요.</div></div></div>`;
}
function changeMonth(delta){
 let y=state.calendarYear ?? new Date().getFullYear(), m=state.calendarMonth ?? new Date().getMonth();
 m+=delta;if(m<0){y--;m=11}if(m>11){y++;m=0}
 state.calendarYear=y;state.calendarMonth=m;save();
}
function showDay(key){
 const item=(state.room.history||[]).find(h=>h.key===key), detail=document.getElementById('day-detail');
 if(!detail)return;
 if(!item){detail.innerHTML=`<div class="muted">${key}에는 등록된 노래가 없어요.</div>`;return}
 detail.innerHTML=`<div class="selected-date">${esc(item.date)}</div>`+(item.songs||[]).map((song,i)=>`<div class="history-song"><div class="history-user">${esc(state.room.users[i]?.name||'사용자')}</div><div><b>${esc(song.artist)}</b> — ${esc(song.title)}</div>${song.note?`<div class="memo">💬 ${esc(song.note)}</div>`:''}</div>`).join('');
}

function submitSong(){
 const artist=document.getElementById('artist').value.trim(), title=document.getElementById('title').value.trim(), note=document.getElementById('note').value.trim();
 if(!artist||!title){alert('가수와 곡 제목을 입력해주세요!');return}
 state.room.users[state.currentUserIndex].song={artist,title,note};
 const u=state.room.users;if(u[0].song&&u[1].song){const now=new Date();const key=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;state.room.history=state.room.history||[];state.room.history=state.room.history.filter(h=>h.key!==key);state.room.history.unshift({key,date:now.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}),songs:[u[0].song,u[1].song]});u[0].song=null;u[1].song=null;}
 save();
}
function render(){
 const a=document.getElementById('app');
 if(state.screen==='home'){a.innerHTML=`<div class="logo">ONE SONG</div><div class="sub">오늘의 한 곡을 서로에게 🎧</div><div class="card"><button class="btn" onclick="create()">방 만들기</button><button class="btn secondary" onclick="join()">친구의 방에 들어가기</button><div class="small">※ 현재는 기기 안에서 작동하는 1차 미리보기예요.</div></div>`;return}
 if(state.screen==='create'){a.innerHTML=`<button class="back" onclick="home()">← 처음으로</button><div class="card"><h2>방 만들기</h2><div class="field"><label>방 이름</label><input id="roomName" placeholder="예: 서빈이랑 친구의 노래방"></div><div class="field"><label>내 이름</label><input id="myName" placeholder="이름 또는 닉네임"></div><button class="btn" onclick="createRoom()">방 만들기</button></div>`;return}
 if(state.screen==='join'){a.innerHTML=`<button class="back" onclick="home()">← 처음으로</button><div class="card"><h2>친구의 방에 들어가기</h2><div class="field"><label>방 코드</label><input id="joinCode" placeholder="예: A7K2P" maxlength="5"></div><div class="field"><label>내 이름</label><input id="friendName" placeholder="이름 또는 닉네임"></div><button class="btn" onclick="joinRoom()">들어가기</button><div class="small">실제 온라인 버전에서는 친구가 만든 방 코드로 접속하게 됩니다.</div></div>`;return}
 if(state.screen==='history'){a.innerHTML=renderHistoryScreen();return}
 if(state.screen==='room'){
  const me=state.room.users[state.currentUserIndex], other=state.room.users[1-state.currentUserIndex];
  const meSubmitted=!!me.song, otherSubmitted=!!other.song;
  let reveal='';
  if(meSubmitted&&otherSubmitted){reveal=`<div class="song"><div class="day">오늘</div><div class="name">${esc(state.room.users[0].name)} · ${esc(state.room.users[0].song.artist)} — ${esc(state.room.users[0].song.title)}</div>${state.room.users[0].song.note?`<div class="note">💬 ${esc(state.room.users[0].song.note)}</div>`:''}</div><div class="song"><div class="name">${esc(state.room.users[1].name)} · ${esc(state.room.users[1].song.artist)} — ${esc(state.room.users[1].song.title)}</div>${state.room.users[1].song.note?`<div class="note">💬 ${esc(state.room.users[1].song.note)}</div>`:''}</div>`}
  else reveal=`<div class="status">${meSubmitted?'내 노래는 제출 완료! 🎵':'오늘의 노래를 골라주세요 🎧'}<br>${otherSubmitted?'친구도 제출했어요! 둘 다 제출하면 공개돼요.':'친구가 아직 고르는 중이에요. 둘 다 제출하면 공개돼요.'}</div>`;
  const form=meSubmitted?`<div class="status">오늘의 노래 제출 완료 ✓</div>`:`<div class="field"><label>가수</label><input id="artist" placeholder="예: D.O."></div><div class="field"><label>곡 제목</label><input id="title" placeholder="예: 괜찮아도 괜찮아"></div><div class="field"><label>작은 메모 <span style="font-weight:400">(선택)</span></label><input id="note" maxlength="100" placeholder="이 노래를 추천하는 이유는? 💬"></div><button class="btn" onclick="submitSong()">오늘의 노래 제출하기</button>`;
  const count=(state.room.history||[]).length;
  a.innerHTML=`<div class="roomhead"><div class="roomname">${esc(state.room.roomName)}</div><div class="hint">방 코드 · ${esc(state.room.code)}</div></div><div class="card"><div class="hint">${esc(me.name)}님</div>${form}${reveal}<button class="btn secondary history-button" onclick="openHistory()">📅 지난 기록${count?` · ${count}일`:''}</button></div><button class="btn secondary" onclick="home()">나가기</button>`;
 }
}
render();
</script></body></html>
